[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adept-imts"
version = "0.1.0"
description = "ADEPT forecasting model and irregular time-series benchmark utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4,<3",
    "pandas==2.3.1",
    "pyarrow>=16.0.0",
    "scipy>=1.13.0",
    "scikit-learn==1.7.1",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
benchmark = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm==4.67.1",
    "requests>=2.32.0",
    "coloredlogs==15.0.1",
    "accelerate==1.10.0",
    "einops==0.8.1",
    "ptflops==0.7.4",
    "wandb==0.21.1",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "vendor/upstream_benchmark/data/physionet.org",
    "vendor/upstream_benchmark/storage",
    "adept_results*",
    "adept_experiments*",
    "chronoa_results*",
    "cross_baseline_results",
    "reruns",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
